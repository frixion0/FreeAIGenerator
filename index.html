<!DOCTYPE html>
<html lang="en">
<head>

    <title>Anime Hentai Viewer</title>
    
    <style>
        /* Force height on EVERY parent element */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevent background scrolling */
            background-color: #000; /* Dark background to hide loading gaps */
        }

        /* The 'dvh' unit is best for mobile browsers */
        #contentFrame {
            width: 100%;
            height: 100vh; /* Fallback for older browsers */
            height: 100dvh; /* Modern mobile-friendly height */
            border: none;
            display: block; /* Removes tiny bottom gaps */
        }
    </style>
</head>
<body>

    <iframe id="contentFrame" 
            src="https://animehentai.art/" 
            sandbox="allow-same-origin allow-scripts allow-forms">
    </iframe>

</body>
